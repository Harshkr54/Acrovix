# Spring Application Properties
spring.application.name=acrovix-backend

# Server Configuration
server.port=${SERVER_PORT:8080}

# PostgreSQL Database Configuration (Externalized Environment Variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Spring Mail / Brevo SMTP Configuration (Externalized Environment Variables)
spring.mail.host=${BREVO_SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${BREVO_SMTP_PORT:587}
spring.mail.username=${BREVO_SMTP_USERNAME:}
spring.mail.password=${BREVO_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${BREVO_SMTP_HOST:smtp-relay.brevo.com}

# Application Mail Sender & Notification Configuration
acrovix.mail.from-email=${MAIL_FROM_EMAIL:sweta@acrovix.com}
acrovix.mail.from-name=${MAIL_FROM_NAME:ACROVIX}
acrovix.mail.notification-email=${ENQUIRY_NOTIFICATION_EMAIL:sweta@acrovix.com}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://acrovix.com,https://www.acrovix.com}

# JSON Formatting
spring.jackson.default-property-inclusion=non_null
