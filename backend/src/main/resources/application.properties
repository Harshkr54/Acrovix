# Spring Application Properties
spring.application.name=acrovix-backend

# Server Configuration
server.port=${PORT:${SERVER_PORT:8080}}

# PostgreSQL Database Configuration (Externalized Environment Variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Spring Mail / Brevo API Configuration
brevo.api-key=${BREVO_API_KEY}

# Application Mail Sender & Notification Configuration
acrovix.mail.from-email=${MAIL_FROM_EMAIL:sweta@acrovix.com}
acrovix.mail.from-name=${MAIL_FROM_NAME:ACROVIX}
acrovix.mail.notification-email=${ENQUIRY_NOTIFICATION_EMAIL:sweta@acrovix.com}
acrovix.mail.asset-base-url=${EMAIL_ASSET_BASE_URL:https://acrovix.com/email-assets}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://acrovix.com,https://www.acrovix.com}

# JSON Formatting
spring.jackson.default-property-inclusion=non_null
