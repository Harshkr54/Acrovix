name: Deploy to Hostinger Prod

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'Admin/admin-frontend/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install public frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Build public frontend
        run: npm run build
        working-directory: ./frontend

      - name: Install admin frontend dependencies
        run: npm ci
        working-directory: ./Admin/admin-frontend

      - name: Build admin frontend
        run: npm run build
        working-directory: ./Admin/admin-frontend
        env:
          VITE_API_BASE_URL: https://acrovix-admin-backend.onrender.com/api/admin

      - name: Assemble deployment directory
        run: |
          mkdir -p deploy_root/admin
          cp -R frontend/dist/* deploy_root/
          cp -R Admin/admin-frontend/dist/* deploy_root/admin/

      - name: Publish hostinger-prod
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_root
          publish_branch: hostinger-prod
          force_orphan: true
