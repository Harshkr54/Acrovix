name: Deploy Admin to Hostinger Prod

on:
  push:
    branches:
      - main
    paths:
      - 'Admin/admin-frontend/**'
      - '.github/workflows/deploy-admin.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./Admin/admin-frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./Admin/admin-frontend

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./Admin/admin-frontend/dist/
          server-dir: /admin/
          dangerous-clean-slate: false

      - name: Deployment Summary
        run: |
          echo "## Admin Frontend Deployment Completed :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "The ACROVIX Admin Panel was successfully built and deployed via FTP." >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** https://admin.acrovix.com/" >> $GITHUB_STEP_SUMMARY
          echo "- **Server Directory:** /admin/" >> $GITHUB_STEP_SUMMARY
