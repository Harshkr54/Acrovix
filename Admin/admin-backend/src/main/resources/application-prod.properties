# Production environment profile
# This overrides settings in application.properties when SPRING_PROFILES_ACTIVE=prod

# JPA / Hibernate Configuration for Production
# VALIDATE ONLY - Production schema must never be automatically updated
spring.jpa.hibernate.ddl-auto=validate

# Disable demo mode for safety
app.demo-mode=false

# Frontend URL for production environment
acrovix.app.frontend-url=${ACROVIX_APP_FRONTEND_URL:https://admin.acrovix.com}
