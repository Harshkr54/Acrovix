# ==============================================================================
# ACROVIX PRODUCTION BACKEND PROFILE (prod)
# ==============================================================================

# Database Connection & SSL/TLS Configuration
spring.datasource.url=${DB_URL}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Production HikariCP High-Throughput Connection Pool Settings
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.keepalive-time=45000
spring.datasource.hikari.pool-name=AcrovixProdHikariPool

# Hibernate DDL Validation (Strict Schema Enforcement - Never modify in production)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Database Migrations (Automated version-controlled execution)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

# Security, Domain & Wildcard CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://admin.acrovix.com,https://app.acrovix.com}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://*.acrovix.com,https://acrovix.com}
acrovix.app.frontend-url=${ACROVIX_APP_FRONTEND_URL:https://admin.acrovix.com}
app.frontend.url=${acrovix.app.frontend-url}
app.base-url=${APP_BASE_URL:${acrovix.app.frontend-url}}

# JWT Authentication
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Razorpay Production Credentials
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}
razorpay.webhook-secret=${razorpay.webhook.secret}

# Mail Delivery (JavaMailSender / SMTP)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Strict Production Rate Limiting
acrovix.security.rate-limit.enabled=true
acrovix.security.rate-limit.public.requests-per-minute=15
acrovix.security.rate-limit.email.requests-per-minute=5
acrovix.security.rate-limit.ai.requests-per-minute=10
acrovix.security.rate-limit.pdf.requests-per-minute=30
acrovix.security.rate-limit.export.requests-per-minute=15

# Demo Mode Disabled in Production
app.demo-mode=false
