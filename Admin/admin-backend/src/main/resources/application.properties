# Spring Application Properties
spring.application.name=admin-backend

# Server Configuration
server.port=${PORT:8081}

# PostgreSQL Database Configuration (Externalized Environment Variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Admin Authentication
jwt.secret=${JWT_SECRET:changethis_secret_key_in_production_environment_with_strong_string}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Initial Super Admin (Defaults for local dev)
admin.initial.name=${INITIAL_ADMIN_NAME:Super Admin}
admin.initial.email=${INITIAL_ADMIN_EMAIL:admin@acrovix.com}
admin.initial.password=${INITIAL_ADMIN_PASSWORD:admin123}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://admin.acrovix.com}

# JSON Formatting
spring.jackson.default-property-inclusion=non_null

# Email Settings
acrovix.mail.from-email=${MAIL_FROM_EMAIL:sales@acrovix.com}
acrovix.mail.from-name=${MAIL_FROM_NAME:ACROVIX}
