# Spring Application Properties
spring.application.name=admin-backend

# Server Configuration
server.port=${PORT:8081}

# PostgreSQL Database Configuration (Externalized Environment Variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Admin Authentication
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Initial Super Admin (Defaults for local dev)
admin.initial.name=${INITIAL_ADMIN_NAME:Super Admin}
admin.initial.email=${INITIAL_ADMIN_EMAIL:admin@acrovix.com}
admin.initial.password=${INITIAL_ADMIN_PASSWORD}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://admin.acrovix.com}

# JSON Formatting
spring.jackson.default-property-inclusion=non_null

# Email Settings & JavaMailSender Configuration
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

acrovix.email.from=${MAIL_FROM:sales@acrovix.com}
acrovix.email.from-name=${MAIL_FROM_NAME:ACROVIX INNOVATIONS PRIVATE LIMITED}
acrovix.email.crm-notification=${CRM_NOTIFICATION_EMAIL:}
# Backward compatibility aliases
acrovix.mail.from-email=${MAIL_FROM_EMAIL:${acrovix.email.from}}
acrovix.mail.from-name=${MAIL_FROM_NAME:${acrovix.email.from-name}}

# External APIs
gemini.api-key=${GEMINI_API_KEY:}
resend.api-key=${RESEND_API_KEY:}

# HikariCP Connection Pool (tuned for Neon serverless PostgreSQL)
# Smaller pool size reduces per-connection overhead on Neon's serverless compute
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
# 5 min idle timeout — recycles connections before Neon serverless proxy drops them
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
# Send a keepalive ping every 60 seconds to prevent connection drops
spring.datasource.hikari.keepalive-time=60000

# Demo Mode Configuration
app.demo-mode=${APP_DEMO_MODE:false}

# --- Phase 4 Security Hardening ---
acrovix.security.rate-limit.enabled=true
acrovix.security.rate-limit.public.requests-per-minute=10
acrovix.security.rate-limit.email.requests-per-minute=3
acrovix.security.rate-limit.ai.requests-per-minute=10
acrovix.security.rate-limit.pdf.requests-per-minute=20
acrovix.security.rate-limit.export.requests-per-minute=10
acrovix.security.rate-limit.default.requests-per-minute=-1
acrovix.security.pagination.max-size=100
acrovix.security.search.max-length=200
