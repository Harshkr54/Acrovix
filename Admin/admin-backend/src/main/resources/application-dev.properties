# Development environment profile
# This overrides settings in application.properties when active

# Schema is managed strictly by Flyway migrations (ddl-auto=none prevents Neon cached plan error)
spring.jpa.hibernate.ddl-auto=none

# Disable Flyway checksum validation in dev to prevent CRLF line-ending mismatches on Windows
spring.flyway.validate-on-migrate=false

# Development environment frontend URL and CORS overrides
acrovix.app.frontend-url=http://localhost:5173
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,https://admin.acrovix.com
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
