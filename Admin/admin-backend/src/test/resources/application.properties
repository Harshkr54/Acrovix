# Test environment — uses the real Neon development database.
# DemoQaTest and Phase4QaTest require a real PostgreSQL connection (JSONB, sequences etc.)
# Set the following environment variables before running integration tests:
#   DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET
# For local development these are read from the .env file via the IDE/shell.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:changethis_secret_key_in_production_environment_with_strong_string}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

admin.initial.name=${INITIAL_ADMIN_NAME:Super Admin}
admin.initial.email=${INITIAL_ADMIN_EMAIL:admin@acrovix.com}
admin.initial.password=${INITIAL_ADMIN_PASSWORD:admin123}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

acrovix.mail.from-email=${MAIL_FROM_EMAIL:sales@acrovix.com}
acrovix.mail.from-name=${MAIL_FROM_NAME:ACROVIX}

gemini.api-key=${GEMINI_API_KEY:}
resend.api-key=${RESEND_API_KEY:}

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000

app.demo-mode=${APP_DEMO_MODE:false}
